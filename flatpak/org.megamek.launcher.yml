# Flatpak that repackages the Java-bundled Linux x64 portable archive.
# The archive's own runtime/bin/java runs the launcher and the games it starts, so
# no Java SDK extension is needed.
#
# This is a template: ./gradlew buildFlatpakBundle stages it under
# build/packaging/flatpak/manifest with the @...@ tokens filled in, next to the
# archive, desktop entry, metainfo and icon, then builds the bundle.
#
# Inside the sandbox the launcher is not at /opt/megamek-launcher, so native
# self-update is unavailable and the launcher only notifies about new releases.
# The bundle has no application repository, so `flatpak update` refreshes only the
# runtime; users update the launcher by installing a newer bundle.

id: org.megamek.launcher
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: mm-launcher

finish-args:
  # Release checks and game downloads.
  - --share=network
  # Java 21 AWT/Swing is X11-only; Wayland sessions use XWayland.
  - --share=ipc
  - --socket=x11
  - --device=dri
  # Game sound effects.
  - --socket=pulseaudio
  # The Swing file choosers do not use the file chooser portal, so without this players could
  # not choose install folders, adopt existing installs, or open units and campaigns in the games.
  # It also shares ~/.mm-launcher with launchers outside Flatpak, which coordinates updates of an
  # install they both use. Folders outside home, such as other drives, remain unavailable.
  - --filesystem=home

modules:
  - name: mm-launcher
    buildsystem: simple
    # Keep the bundled Temurin runtime byte-identical to the portable archive.
    build-options:
      no-debuginfo: true
    sources:
      - type: archive
        path: "@PORTABLE_ARCHIVE@"
        dest: payload
      # The archive's mm-launcher script locates its sibling runtime and payload
      # from its own path, so it cannot be symlinked into /app/bin.
      - type: script
        dest-filename: mm-launcher-wrapper
        commands:
          - exec /app/lib/mm-launcher/mm-launcher "$@"
      - type: file
        path: org.megamek.launcher.png
      - type: file
        path: org.megamek.launcher.desktop
      - type: file
        path: org.megamek.launcher.metainfo.xml
    build-commands:
      - mkdir -p /app/lib/mm-launcher
      - cp -a payload/. /app/lib/mm-launcher/
      - install -Dm755 mm-launcher-wrapper /app/bin/mm-launcher
      - install -Dm644 org.megamek.launcher.png -t /app/share/icons/hicolor/256x256/apps
      - install -Dm644 org.megamek.launcher.desktop -t /app/share/applications
      - install -Dm644 org.megamek.launcher.metainfo.xml -t /app/share/metainfo
